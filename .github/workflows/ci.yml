name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: brew install portaudio
      - run: pip install -r requirements.txt pytest pytest-asyncio ruff
      # real errors only (syntax, undefined names); style is not enforced yet
      - run: ruff check . --select E9,F63,F7,F82 --exclude frontend,desktop-overlay
      - name: Unit tests
        run: pytest -q tests -k "not test_browser_"
      # the browser tests load real web pages, so a site blocking CI shouldn't fail the build
      - name: Browser tests (live web, informational)
        continue-on-error: true
        run: |
          python -m playwright install chromium
          pytest -q tests/test_browser_integration.py -k "test_browser_"
